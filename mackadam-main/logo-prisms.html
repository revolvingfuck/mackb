<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No x 1 — triangular prisms</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #reveal { position: fixed; inset: 0; z-index: 0; }
  .curtain {
    position: fixed; left: 0; top: 0; z-index: 1;
    transform-origin: 0 0; will-change: transform;
  }
  canvas { display: block; position: fixed; inset: 0; z-index: 2; }
</style>
</head>
<body>
<div id="reveal"></div>
<div class="curtain" id="curtainA"></div>
<div class="curtain" id="curtainB"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// Each solid is a straight triangular prism standing vertically.
// Vertices come from pixel measurements of the source PNG.
// ============================================================
const IMG = { cx: 959.5, cy: 543, s: 100 };
const PITCH = THREE.MathUtils.degToRad(35);

const SHAPES = [
  { // cyan through to purple
    ramp: [0x0E9AAE, 0x1C79C0, 0x2F57C2, 0x4436B0, 0x531F92],
    b0: [520, 737], b1: [951, 900], drop: 324, rise: 529
  },
  { // yellow through to red
    ramp: [0xD9A005, 0xD17B04, 0xC55708, 0xB43810, 0x9E1A16],
    b0: [1401, 572], b1: [973, 732], drop: 328, rise: 546
  }
];

const CFG = { offX: 22, orbitSpeed: 0.42 };
const FIELD  = '#000000';                       // what the prisms sit on
const REVEAL = './mackadam-background.png';     // what the split opens onto

const T = {
  inStart: 0.0,  inEnd: 2.8,
  rotStart: 3.4, rotEnd: 5.1,
  outStart: 5.5, outEnd: 6.1,
  loopAt: 6.9
};

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.5, 400);
const DIST = 26;

// ---------- geometry ----------
const px = x => (x - IMG.cx) / IMG.s;
const py = y => (IMG.cy - y) / IMG.s;
const zFor = screenDy => screenDy / Math.sin(PITCH);

function buildPrism(s) {
  const dx  = (s.b1[0] - s.b0[0]) / IMG.s;
  const dyB = (s.b0[1] - s.b1[1]) / IMG.s;
  const H   = (s.rise / IMG.s) / Math.cos(PITCH);

  const A = [0,  0, 0];
  const B = [dx, 0, zFor(dyB)];
  const C = [0,  0, zFor(-s.drop / IMG.s)];         // the point of the prism
  const up = p => [p[0], p[1] + H, p[2]];
  const [A2, B2, C2] = [up(A), up(B), up(C)];

  const tris = [], groups = [];
  const push = (...pts) => pts.forEach(p => tris.push(...p));
  const mark = fn => { const st = tris.length / 3; fn(); groups.push([st, tris.length / 3 - st]); };

  mark(() => { push(A, B, B2);  push(A, B2, A2); });   // 0 broad face
  mark(() => { push(B, C, C2);  push(B, C2, B2); });   // 1 side
  mark(() => { push(C, A, A2);  push(C, A2, C2); });   // 2 side
  mark(() => { push(A, C, B); });                      // 3 bottom cap
  mark(() => { push(A2, B2, C2); });                   // 4 top cap

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tris, 3));
  g.computeVertexNormals();
  groups.forEach(([st, ct], i) => g.addGroup(st, ct, i));

  const mesh = new THREE.Mesh(g, s.ramp.map(c =>
    new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })));

  mesh.position.set(px(s.b0[0]), py(s.b0[1]) / Math.cos(PITCH), 0);
  // midpoint of the vertical edge that runs along the prism's point
  mesh.userData.point = new THREE.Vector3(C[0], C[1] + H / 2, C[2]);
  return mesh;
}

const group = new THREE.Group();
scene.add(group);
const solids = SHAPES.map(s => { const m = buildPrism(s); group.add(m); return m; });

const box = new THREE.Box3().setFromObject(group);
const mid = box.getCenter(new THREE.Vector3());
solids.forEach(m => m.position.sub(mid));
const home = solids.map(m => m.position.clone());

// ---------- easing ----------
const clamp01 = v => Math.max(0, Math.min(1, v));
const outCubic   = t => 1 - Math.pow(1 - t, 3);
const inCubic    = t => t * t * t;
const inOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const span = (t, a, b) => clamp01((t - a) / (b - a));

// ---------- stage ----------
const elReveal = document.getElementById('reveal');
const curtains = [document.getElementById('curtainA'), document.getElementById('curtainB')];

function dressStage() {
  curtains.forEach(c => c.style.background = FIELD);
  elReveal.style.background = `${FIELD} center/cover no-repeat url("${REVEAL}")`;
}

let SHEET = 0;
function sizeCurtains() {
  SHEET = Math.hypot(innerWidth, innerHeight) * 1.6;
  curtains.forEach(c => { c.style.width = SHEET + 'px'; c.style.height = SHEET + 'px'; });
}

// The seam is a real line in the scene: the vertical axis sitting between the two
// prisms. It belongs to the group, so it turns with the 90-degree rotation and
// re-projects every frame as the camera orbits.
const AXIS_LEN = 12;
const _a = new THREE.Vector3(), _b = new THREE.Vector3();

function toScreen(v) {
  v.project(camera);
  return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
}

let seamAngle = 0;
function layoutCurtains(open) {
  const p0 = toScreen(_a.set(0, -AXIS_LEN, 0).applyMatrix4(group.matrixWorld));
  const p1 = toScreen(_b.set(0,  AXIS_LEN, 0).applyMatrix4(group.matrixWorld));

  const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  // hold the last angle if the axis swings edge-on to the camera
  if (Math.hypot(dx, dy) > 4) seamAngle = Math.atan2(dy, dx);

  const gap = open * SHEET * 0.5;
  const bite = 1.5;   // overlap the sheets so the reveal can't bleed through the seam
  const base = `translate(${mx}px, ${my}px) rotate(${seamAngle}rad)`;
  curtains[0].style.transform = `${base} translate(${-SHEET / 2}px, ${-SHEET - gap + bite}px)`;
  curtains[1].style.transform = `${base} translate(${-SHEET / 2}px, ${gap - bite}px)`;
}

// ---------- animation ----------
const _v = new THREE.Vector3();
const _q = new THREE.Quaternion();
let t = 0, orbitT = 0, last = performance.now();

function place(mesh, base, worldX) {
  _v.set(worldX, 0, 0);
  _q.copy(group.quaternion).invert();
  _v.applyQuaternion(_q);
  mesh.position.copy(base).add(_v);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  orbitT += dt * CFG.orbitSpeed;
  camera.position.set(
    Math.sin(orbitT) * DIST * Math.cos(PITCH),
    -Math.sin(PITCH) * DIST,
     Math.cos(orbitT) * DIST * Math.cos(PITCH)
  );
  camera.lookAt(0, 0, 0);

  t += dt;
  if (t >= T.loopAt) t = 0;

  const pIn  = outCubic(span(t, T.inStart, T.inEnd));
  const pOut = inCubic(span(t, T.outStart, T.outEnd));
  const offset = CFG.offX * (1 - pIn) + CFG.offX * pOut;

  group.rotation.z = -Math.PI / 2 * inOutCubic(span(t, T.rotStart, T.rotEnd));
  place(solids[0], home[0], -offset);
  place(solids[1], home[1],  offset);

  group.updateMatrixWorld();
  camera.updateMatrixWorld();
  layoutCurtains(pOut);

  renderer.render(scene, camera);
}

// ---------- plumbing ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizeCurtains();
});

sizeCurtains();
dressStage();
requestAnimationFrame(frame);
</script>
</body>
</html>
